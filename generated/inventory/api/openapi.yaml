          description: The frequency of requests was greater than allowed.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInventoryItemResponse'
          description: An unexpected condition occurred that prevented the server
            from fulfilling the request.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInventoryItemResponse'
          description: Temporary overloading or maintenance of the server.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
      tags:
      - fbaInventory
      x-codegen-request-body-name: createInventoryItemRequestBody
    x-amzn-api-sandbox:
      dynamic: {}
    x-amzn-api-sandbox-only: true
  /fba/inventory/v1/items/{sellerSku}:
    delete:
      description: "Requests that Amazon Deletes an item from the Sandbox Inventory\
        \ in the sandbox environment. This is a sandbox-only operation and must be\
        \ directed to a sandbox endpoint. Refer to [Selling Partner API sandbox](https://developer-docs.amazon.com/sp-api/docs/the-selling-partner-api-sandbox)\
        \ for more information."
      operationId: deleteInventoryItem
      parameters:
      - description: A single seller SKU used for querying the specified seller SKU
          inventory summaries.
        in: path
        name: sellerSku
        required: true
        schema:
          type: string
      - description: The marketplace ID for the marketplace for which the sellerSku
          is to be deleted.
        in: query
        name: marketplaceId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInventoryItemResponse'
          description: OK
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInventoryItemResponse'
          description: Request has missing or invalid parameters and cannot be parsed.
          headers:
