          description: "Indicates access to the resource is forbidden. Possible reasons\
            \ include Access Denied, Unauthorized, Expired Token, Invalid Signature\
            \ or Resource Not Found."
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInventoryItemResponse'
          description: The specified resource does not exist.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInventoryItemResponse'
          description: The frequency of requests was greater than allowed.
          headers:
