components:
  schemas:
    CreateInventoryItemRequest:
      description: An item to be created in the inventory.
      example:
        marketplaceId: marketplaceId
        sellerSku: sellerSku
        productName: productName
      properties:
        sellerSku:
          description: The seller SKU of the item.
          type: string
        marketplaceId:
          description: The marketplaceId.
          type: string
        productName:
          description: The name of the item.
          type: string
      required:
      - marketplaceId
      - productName
      - sellerSku
      type: object
    AddInventoryRequest:
      description: The object with the list of Inventory to be added
      example:
        inventoryItems:
        - marketplaceId: marketplaceId
          quantity: 0
          sellerSku: sellerSku
        - marketplaceId: marketplaceId
          quantity: 0
          sellerSku: sellerSku
      properties:
        inventoryItems:
          description: List of Inventory to be added
          items:
            $ref: '#/components/schemas/InventoryItem'
          type: array
      type: object
    InventoryItems:
      description: List of Inventory to be added
      items:
        $ref: '#/components/schemas/InventoryItem'
      type: array
    InventoryItem:
      description: An item in the list of inventory to be added.
      example:
        marketplaceId: marketplaceId
        quantity: 0
        sellerSku: sellerSku
      properties:
        sellerSku:
          description: The seller SKU of the item.
          type: string
        marketplaceId:
          description: The marketplaceId.
          type: string
        quantity:
          description: The quantity of item to add.
          type: integer
      required:
      - marketplaceId
      - quantity
      - sellerSku
      type: object
    CreateInventoryItemResponse:
      description: The response schema for the CreateInventoryItem operation.
      example:
        errors:
        - code: code
          details: details
          message: message
        - code: code
          details: details
          message: message
      properties:
        errors:
          description: A list of error responses returned when a request is unsuccessful.
          items:
            $ref: '#/components/schemas/Error'
          type: array
      type: object
    DeleteInventoryItemResponse:
      description: The response schema for the DeleteInventoryItem operation.
      example:
        errors:
        - code: code
          details: details
          message: message
        - code: code
          details: details
          message: message
      properties:
        errors:
          description: A list of error responses returned when a request is unsuccessful.
          items:
            $ref: '#/components/schemas/Error'
          type: array
      type: object
    AddInventoryResponse:
      description: The response schema for the AddInventory operation.
      example:
        errors:
        - code: code
          details: details
          message: message
        - code: code
          details: details
          message: message
      properties:
        errors:
          description: A list of error responses returned when a request is unsuccessful.
          items:
            $ref: '#/components/schemas/Error'
          type: array
      type: object
    Granularity:
      description: "Describes a granularity at which inventory data can be aggregated.\
        \ For example, if you use Marketplace granularity, the fulfillable quantity\
        \ will reflect inventory that could be fulfilled in the given marketplace."
      example:
        granularityType: granularityType
        granularityId: granularityId
      properties:
        granularityType:
          description: The granularity type for the inventory aggregation level.
          type: string
          x-docgen-enum-table-extension:
          - value: Marketplace
            description: Marketplace
        granularityId:
          description: "The granularity ID for the specified granularity type. When\
            \ granularityType is Marketplace, specify the marketplaceId."
          type: string
      type: object
    ReservedQuantity:
      description: The quantity of reserved inventory.
      example:
        pendingTransshipmentQuantity: 7
        pendingCustomerOrderQuantity: 2
        totalReservedQuantity: 5
        fcProcessingQuantity: 9
      properties:
        totalReservedQuantity:
          description: "The total number of units in Amazon's fulfillment network\
            \ that are currently being picked, packed, and shipped; or are sidelined\
            \ for measurement, sampling, or other internal processes."
          type: integer
        pendingCustomerOrderQuantity:
          description: The number of units reserved for customer orders.
          type: integer
        pendingTransshipmentQuantity:
          description: The number of units being transferred from one fulfillment
            center to another.
          type: integer
        fcProcessingQuantity:
          description: The number of units that have been sidelined at the fulfillment
            center for additional processing.
          type: integer
      type: object
    ResearchingQuantityEntry:
      description: The misplaced or warehouse damaged inventory that is actively being
        confirmed at our fulfillment centers.
      example:
        quantity: 2
        name: researchingQuantityInShortTerm
      properties:
        name:
          description: The duration of the research.
          enum:
          - researchingQuantityInShortTerm
          - researchingQuantityInMidTerm
          - researchingQuantityInLongTerm
          type: string
          x-docgen-enum-table-extension:
          - value: researchingQuantityInShortTerm
            description: Short Term for 1-10 days.
          - value: researchingQuantityInMidTerm
            description: Mid Term for 11-20 days.
          - value: researchingQuantityInLongTerm
            description: Long Term for 21 days or longer.
        quantity:
          description: The number of units.
          type: integer
      required:
      - name
      - quantity
      type: object
    ResearchingQuantity:
      description: The number of misplaced or warehouse damaged units that are actively
        being confirmed at our fulfillment centers.
      example:
        totalResearchingQuantity: 3
        researchingQuantityBreakdown:
        - quantity: 2
          name: researchingQuantityInShortTerm
        - quantity: 2
          name: researchingQuantityInShortTerm
      properties:
        totalResearchingQuantity:
          description: The total number of units currently being researched in Amazon's
            fulfillment network.
          type: integer
        researchingQuantityBreakdown:
          description: A list of quantity details for items currently being researched.
          items:
            $ref: '#/components/schemas/ResearchingQuantityEntry'
          type: array
      type: object
    UnfulfillableQuantity:
      description: The quantity of unfulfillable inventory.
      example:
        distributorDamagedQuantity: 1
        warehouseDamagedQuantity: 1
        expiredQuantity: 7
        customerDamagedQuantity: 7
        totalUnfulfillableQuantity: 4
        defectiveQuantity: 6
        carrierDamagedQuantity: 1
      properties:
        totalUnfulfillableQuantity:
          description: The total number of units in Amazon's fulfillment network in
            unsellable condition.
          type: integer
        customerDamagedQuantity:
          description: The number of units in customer damaged disposition.
          type: integer
        warehouseDamagedQuantity:
          description: The number of units in warehouse damaged disposition.
          type: integer
        distributorDamagedQuantity:
          description: The number of units in distributor damaged disposition.
          type: integer
        carrierDamagedQuantity:
          description: The number of units in carrier damaged disposition.
          type: integer
        defectiveQuantity:
          description: The number of units in defective disposition.
          type: integer
        expiredQuantity:
          description: The number of units in expired disposition.
          type: integer
      type: object
    InventoryDetails:
      description: Summarized inventory details. This object will not appear if the
        details parameter in the request is false.
      example:
        inboundShippedQuantity: 1
        inboundWorkingQuantity: 6
        reservedQuantity:
          pendingTransshipmentQuantity: 7
          pendingCustomerOrderQuantity: 2
          totalReservedQuantity: 5
          fcProcessingQuantity: 9
        unfulfillableQuantity:
          distributorDamagedQuantity: 1
          warehouseDamagedQuantity: 1
          expiredQuantity: 7
          customerDamagedQuantity: 7
          totalUnfulfillableQuantity: 4
          defectiveQuantity: 6
          carrierDamagedQuantity: 1
        inboundReceivingQuantity: 5
        researchingQuantity:
          totalResearchingQuantity: 3
          researchingQuantityBreakdown:
          - quantity: 2
            name: researchingQuantityInShortTerm
          - quantity: 2
            name: researchingQuantityInShortTerm
        fulfillableQuantity: 0
      properties:
        fulfillableQuantity:
          description: "The item quantity that can be picked, packed, and shipped."
          type: integer
        inboundWorkingQuantity:
          description: The number of units in an inbound shipment for which you have
            notified Amazon.
          type: integer
        inboundShippedQuantity:
          description: The number of units in an inbound shipment that you have notified
            Amazon about and have provided a tracking number.
          type: integer
        inboundReceivingQuantity:
          description: "The number of units that have not yet been received at an\
            \ Amazon fulfillment center for processing, but are part of an inbound\
            \ shipment with some units that have already been received and processed."
          type: integer
        reservedQuantity:
          $ref: '#/components/schemas/ReservedQuantity'
        researchingQuantity:
          $ref: '#/components/schemas/ResearchingQuantity'
        unfulfillableQuantity:
          $ref: '#/components/schemas/UnfulfillableQuantity'
      type: object
    InventorySummary:
      description: Inventory summary for a specific item.
      example:
        condition: condition
        totalQuantity: 1
        fnSku: fnSku
        stores:
        - stores
        - stores
        inventoryDetails:
          inboundShippedQuantity: 1
          inboundWorkingQuantity: 6
          reservedQuantity:
            pendingTransshipmentQuantity: 7
            pendingCustomerOrderQuantity: 2
            totalReservedQuantity: 5
            fcProcessingQuantity: 9
          unfulfillableQuantity:
            distributorDamagedQuantity: 1
            warehouseDamagedQuantity: 1
            expiredQuantity: 7
            customerDamagedQuantity: 7
            totalUnfulfillableQuantity: 4
            defectiveQuantity: 6
            carrierDamagedQuantity: 1
          inboundReceivingQuantity: 5
          researchingQuantity:
            totalResearchingQuantity: 3
            researchingQuantityBreakdown:
            - quantity: 2
              name: researchingQuantityInShortTerm
            - quantity: 2
              name: researchingQuantityInShortTerm
          fulfillableQuantity: 0
        asin: asin
        lastUpdatedTime: 2000-01-23T04:56:07.000+00:00
        sellerSku: sellerSku
        productName: productName
      properties:
        asin:
          description: The Amazon Standard Identification Number (ASIN) of an item.
          type: string
        fnSku:
          description: Amazon's fulfillment network SKU identifier.
          type: string
        sellerSku:
          description: The seller SKU of the item.
          type: string
        condition:
          description: "The condition of the item as described by the seller (for\
            \ example, New Item)."
          type: string
        inventoryDetails:
