openapi: 3.0.1
info:
  contact:
    name: Selling Partner API Developer Support
    url: https://sellercentral.amazon.com/gp/mws/contactus.html
  description: The Selling Partner API for FBA Inventory lets you programmatically
    retrieve information about inventory in Amazon's fulfillment network.
  license:
    name: Apache License 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  title: Selling Partner API for FBA Inventory
  version: v1
servers:
- url: https://sellingpartnerapi-na.amazon.com/
paths:
  /fba/inventory/v1/summaries:
    get:
      description: |-
        Returns a list of inventory summaries. The summaries returned depend on the presence or absence of the startDateTime, sellerSkus and sellerSku parameters:

        - All inventory summaries with available details are returned when the startDateTime, sellerSkus and sellerSku parameters are omitted.
        - When startDateTime is provided, the operation returns inventory summaries that have had changes after the date and time specified. The sellerSkus and sellerSku parameters are ignored. Important: To avoid errors, use both startDateTime and nextToken to get the next page of inventory summaries that have changed after the date and time specified.
        - When the sellerSkus parameter is provided, the operation returns inventory summaries for only the specified sellerSkus. The sellerSku parameter is ignored.
        - When the sellerSku parameter is provided, the operation returns inventory summaries for only the specified sellerSku.

        Note: The parameters associated with this operation may contain special characters that must be encoded to successfully call the API. To avoid errors with SKUs when encoding URLs, refer to [URL Encoding](https://developer-docs.amazon.com/sp-api/docs/url-encoding).

        Usage Plan:

        | Rate (requests per second) | Burst |
        | ---- | ---- |
        | 2 | 2 |

        The x-amzn-RateLimit-Limit response header returns the usage plan rate limits that were applied to the requested operation, when available. The table above indicates the default rate and burst values for this operation. Selling partners whose business demands require higher throughput may see higher rate and burst values than those shown here. For more information, see [Usage Plans and Rate Limits in the Selling Partner API](https://developer-docs.amazon.com/sp-api/docs/usage-plans-and-rate-limits).
      operationId: getInventorySummaries
      parameters:
      - description: "true to return inventory summaries with additional summarized\
          \ inventory details and quantities. Otherwise, returns inventory summaries\
          \ only (default value)."
        in: query
        name: details
        schema:
          default: false
          type: boolean
      - description: The granularity type for the inventory aggregation level.
        in: query
        name: granularityType
        required: true
        schema:
          enum:
          - Marketplace
          type: string
          x-docgen-enum-table-extension:
          - value: Marketplace
            description: Marketplace
        x-docgen-enum-table-extension:
        - value: Marketplace
          description: Marketplace
      - description: The granularity ID for the inventory aggregation level.
        in: query
        name: granularityId
        required: true
        schema:
          type: string
      - description: "A start date and time in ISO8601 format. If specified, all inventory\
          \ summaries that have changed since then are returned. You must specify\
          \ a date and time that is no earlier than 18 months prior to the date and\
          \ time when you call the API. Note: Changes in inboundWorkingQuantity, inboundShippedQuantity\
          \ and inboundReceivingQuantity are not detected."
        in: query
        name: startDateTime
        schema:
          format: date-time
          type: string
      - description: A list of seller SKUs for which to return inventory summaries.
          You may specify up to 50 SKUs.
        explode: false
        in: query
        name: sellerSkus
        schema:
          items:
            type: string
          maxItems: 50
          type: array
        style: form
      - description: A single seller SKU used for querying the specified seller SKU
          inventory summaries.
        in: query
        name: sellerSku
        schema:
          type: string
      - description: String token returned in the response of your previous request.
          The string token will expire 30 seconds after being created.
        in: query
        name: nextToken
        schema:
          type: string
      - description: The marketplace ID for the marketplace for which to return inventory
          summaries.
        explode: false
        in: query
        name: marketplaceIds
        required: true
        schema:
          items:
            type: string
          maxItems: 1
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInventorySummariesResponse'
          description: OK
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInventorySummariesResponse'
          description: Request has missing or invalid parameters and cannot be parsed.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInventorySummariesResponse'
          description: "Indicates access to the resource is forbidden. Possible reasons\
            \ include Access Denied, Unauthorized, Expired Token, Invalid Signature\
            \ or Resource Not Found."
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInventorySummariesResponse'
          description: The specified resource does not exist.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInventorySummariesResponse'
          description: The frequency of requests was greater than allowed.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInventorySummariesResponse'
          description: An unexpected condition occurred that prevented the server
            from fulfilling the request.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInventorySummariesResponse'
          description: Temporary overloading or maintenance of the server.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
      tags:
      - fbaInventory
    x-amzn-api-sandbox:
      dynamic: {}
  /fba/inventory/v1/items:
    post:
      description: "Requests that Amazon create product-details in the Sandbox Inventory\
