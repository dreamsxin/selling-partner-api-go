    x-amzn-api-sandbox:
      dynamic: {}
    x-amzn-api-sandbox-only: true
  /fba/inventory/v1/items/inventory:
    post:
      description: "Requests that Amazon add items to the Sandbox Inventory with desired\
        \ amount of quantity in the sandbox environment. This is a sandbox-only operation\
        \ and must be directed to a sandbox endpoint. Refer to [Selling Partner API\
        \ sandbox](https://developer-docs.amazon.com/sp-api/docs/the-selling-partner-api-sandbox)\
        \ for more information."
      operationId: addInventory
      parameters:
      - description: A unique token/requestId provided with each call to ensure idempotency.
        in: header
        name: x-amzn-idempotency-token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddInventoryRequest'
        description: List of items to add to Sandbox inventory.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddInventoryResponse'
          description: OK
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddInventoryResponse'
          description: Request has missing or invalid parameters and cannot be parsed.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
