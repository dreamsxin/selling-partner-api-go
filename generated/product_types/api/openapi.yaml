        schema:
          type: string
      - description: |-
          A comma-delimited list of Amazon marketplace identifiers for the request.
          Note: This parameter is limited to one marketplaceId at this time.
        example: ATVPDKIKX0DER
        explode: false
        in: query
        name: marketplaceIds
        required: true
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "The version of the Amazon product type to retrieve. Defaults\
          \ to \"LATEST\". Prerelease versions of product type definitions may be\
          \ retrieved with \"RELEASE_CANDIDATE\". If no prerelease version is currently\
          \ available, the \"LATEST\" live version will be provided."
        example: LATEST
        in: query
        name: productTypeVersion
        schema:
          default: LATEST
          type: string
      - description: The name of the requirements set to retrieve requirements for.
        example: LISTING
        in: query
        name: requirements
        schema:
          default: LISTING
          enum:
          - LISTING
          - LISTING_PRODUCT_ONLY
          - LISTING_OFFER_ONLY
          type: string
          x-docgen-enum-table-extension:
          - value: LISTING
            description: Request schema containing product facts and sales terms.
          - value: LISTING_PRODUCT_ONLY
            description: Request schema containing product facts only.
          - value: LISTING_OFFER_ONLY
            description: Request schema containing sales terms only.
        x-docgen-enum-table-extension:
