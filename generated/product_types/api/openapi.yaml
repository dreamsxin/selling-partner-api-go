openapi: 3.0.1
info:
  contact:
    name: Selling Partner API Developer Support
    url: https://sellercentral.amazon.com/gp/mws/contactus.html
  description: |-
    The Selling Partner API for Product Type Definitions provides programmatic access to attribute and data requirements for product types in the Amazon catalog. Use this API to return the JSON Schema for a product type that you can then use with other Selling Partner APIs, such as the Selling Partner API for Listings Items, the Selling Partner API for Catalog Items, and the Selling Partner API for Feeds (for JSON-based listing feeds).

    For more information, see the [Product Type Definitions API Use Case Guide](doc:product-type-api-use-case-guide).
  license:
    name: Apache License 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  title: Selling Partner API for Product Type Definitions
  version: 2020-09-01
servers:
- url: https://sellingpartnerapi-na.amazon.com/
paths:
  /definitions/2020-09-01/productTypes:
    get:
      description: |-
        Search for and return a list of Amazon product types that have definitions available.

        **Usage Plans:**

        | Plan type | Rate (requests per second) | Burst |
        | ---- | ---- | ---- |
        |Default| 5 | 10 |
        |Selling partner specific| Variable | Variable |

        The x-amzn-RateLimit-Limit response header returns the usage plan rate limits that were applied to the requested operation. Rate limits for some selling partners will vary from the default rate and burst shown in the table above. For more information, see [Usage Plans and Rate Limits in the Selling Partner API](doc:usage-plans-and-rate-limits-in-the-sp-api).
      operationId: searchDefinitionsProductTypes
      parameters:
      - description: A comma-delimited list of keywords to search product types. **Note:**
          Cannot be used with `itemName`.
        example: LUGGAGE
        explode: false
        in: query
        name: keywords
        schema:
          items:
            type: string
          type: array
        style: form
      - description: A comma-delimited list of Amazon marketplace identifiers for
          the request.
        example: ATVPDKIKX0DER
        explode: false
        in: query
        name: marketplaceIds
        required: true
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Title of ASIN to get product type recommendation. **Note:** Cannot
          be used with `keywords`.
        example: Running shoes
        in: query
        name: itemName
        schema:
          type: string
      - description: Locale for display names in response. Defaults to primary locale
          of the marketplace.
        example: en_US
        in: query
        name: locale
        schema:
          type: string
      - description: Language used for `keywords` or `itemName` parameters. Defaults
          to primary locale of the marketplace.
        example: en_US
        in: query
        name: searchLocale
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                productTypes:
                - name: LUGGAGE
                  displayName: Luggage
                  marketplaceIds:
                  - ATVPDKIKX0DER
                productTypeVersion: UHqSqmb4FNUk=
              schema:
                $ref: '#/components/schemas/ProductTypeList'
          description: Successfully retrieved a list of Amazon product types that
            have definitions available.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
          x-amzn-api-sandbox:
            static:
            - request:
                parameters: {}
              response:
                productTypes:
                - name: LUGGAGE
                  displayName: Luggage
                  marketplaceIds:
                  - ATVPDKIKX0DER
                productTypeVersion: UHqSqmb4FNUk=
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: Request has missing or invalid parameters and cannot be parsed.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
          x-amzn-api-sandbox:
            static:
            - request:
                parameters:
                  keywords:
                    value:
                    - Invalid Request
              response:
                errors:
                - code: BAD_REQUEST
                  message: Invalid input
                  details: Invalid input
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: "Indicates that access to the resource is forbidden. Possible\
            \ reasons include Access Denied, Unauthorized, Expired Token, or Invalid\
            \ Signature."
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: The resource specified does not exist.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: The request exceeds the maximum size.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: The request payload is in an unsupported format.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: The frequency of requests was greater than allowed.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: An unexpected condition occurred that prevented the server
            from fulfilling the request.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: Temporary overloading or maintenance of the server.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
      tags:
      - definitions
  /definitions/2020-09-01/productTypes/{productType}:
    get:
      description: |-
        Retrieve an Amazon product type definition.

        **Usage Plans:**

        | Plan type | Rate (requests per second) | Burst |
        | ---- | ---- | ---- |
        |Default| 5 | 10 |
        |Selling partner specific| Variable | Variable |

        The x-amzn-RateLimit-Limit response header returns the usage plan rate limits that were applied to the requested operation. Rate limits for some selling partners will vary from the default rate and burst shown in the table above. For more information, see [Usage Plans and Rate Limits in the Selling Partner API](doc:usage-plans-and-rate-limits-in-the-sp-api).
