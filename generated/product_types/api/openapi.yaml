      parameters:
      - description: The Amazon product type name.
        example: LUGGAGE
        in: path
        name: productType
        required: true
        schema:
          type: string
      - description: "A selling partner identifier. When provided, seller-specific\
          \ requirements and values are populated within the product type definition\
          \ schema, such as brand names associated with the selling partner."
