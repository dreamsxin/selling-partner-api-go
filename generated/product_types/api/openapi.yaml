components:
  schemas:
    Error:
      description: Error response returned when the request is unsuccessful.
      example:
        code: code
        details: details
        message: message
      properties:
        code:
          description: An error code that identifies the type of error that occurred.
          type: string
        message:
          description: A message that describes the error condition.
          type: string
        details:
          description: Additional details that can help the caller understand or fix
            the issue.
          type: string
      required:
      - code
      - message
      type: object
    ErrorList:
      description: A list of error responses returned when a request is unsuccessful.
      example:
        errors:
        - code: code
          details: details
          message: message
        - code: code
          details: details
          message: message
      properties:
        errors:
          description: A list of error responses.
          items:
            $ref: '#/components/schemas/Error'
          type: array
      required:
      - errors
      type: object
    SchemaLink:
      description: A link to metadata schema.
      example:
        link:
          resource: resource
          verb: GET
        checksum: checksum
      properties:
        link:
          $ref: '#/components/schemas/SchemaLink_link'
        checksum:
          description: "Checksum hash of the schema (Base64 MD5). Use this to verify\
            \ schema contents, identify changes between schema versions, and for caching."
          type: string
      required:
      - checksum
      - link
      type: object
    ProductTypeDefinition:
      description: "A product type definition represents the attributes and data requirements\
        \ for a product type in the Amazon catalog. Product type definitions are used\
        \ interchangeably between the Selling Partner API for Listings Items, Selling\
        \ Partner API for Catalog Items, and JSON-based listings feeds in the Selling\
        \ Partner API for Feeds."
      example:
        schema:
          link:
            resource: resource
            verb: GET
          checksum: checksum
        requirementsEnforced: ENFORCED
        requirements: LISTING
        marketplaceIds:
        - marketplaceIds
        - marketplaceIds
        productTypeVersion:
          version: version
          releaseCandidate: true
          latest: true
        displayName: displayName
        metaSchema:
          link:
            resource: resource
            verb: GET
          checksum: checksum
        locale: locale
        productType: productType
        propertyGroups:
          key:
            propertyNames:
            - propertyNames
            - propertyNames
            description: description
            title: title
      properties:
        metaSchema:
          $ref: '#/components/schemas/SchemaLink'
        schema:
          $ref: '#/components/schemas/SchemaLink'
        requirements:
          description: Name of the requirements set represented in this product type
            definition.
          enum:
          - LISTING
          - LISTING_PRODUCT_ONLY
          - LISTING_OFFER_ONLY
          type: string
          x-docgen-enum-table-extension:
          - value: LISTING
            description: Indicates the schema data contains product facts and sales
              terms.
          - value: LISTING_PRODUCT_ONLY
            description: Indicates the schema data contains product facts only.
          - value: LISTING_OFFER_ONLY
            description: Indicates the schema data contains sales terms only.
        requirementsEnforced:
          description: Identifies if the required attributes for a requirements set
            are enforced by the product type definition schema. Non-enforced requirements
            enable structural validation of individual attributes without all of the
            required attributes being present (such as for partial updates).
          enum:
          - ENFORCED
          - NOT_ENFORCED
          type: string
          x-docgen-enum-table-extension:
          - value: ENFORCED
            description: Schema enforces required and conditionally required attributes
              (used for full payload validation).
          - value: NOT_ENFORCED
            description: "Schema does not enforce required and conditionally required\
              \ attributes (used for partial payload validation, such as for single\
              \ attributes)."
        propertyGroups:
