      - description: Identifies if the required attributes for a requirements set
          are enforced by the product type definition schema. Non-enforced requirements
          enable structural validation of individual attributes without all the required
          attributes being present (such as for partial updates).
        example: ENFORCED
        in: query
        name: requirementsEnforced
        schema:
          default: ENFORCED
          enum:
          - ENFORCED
          - NOT_ENFORCED
          type: string
          x-docgen-enum-table-extension:
