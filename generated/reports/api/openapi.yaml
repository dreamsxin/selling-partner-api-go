      description: |-
        Returns report details for the reports that match the filters that you specify.

        **Usage Plan:**

        | Rate (requests per second) | Burst |
        | ---- | ---- |
        | 0.0222 | 10 |

        The `x-amzn-RateLimit-Limit` response header returns the usage plan rate limits that were applied to the requested operation, when available. The table above indicates the default rate and burst values for this operation. Selling partners whose business demands require higher throughput may see higher rate and burst values than those shown here. For more information, refer to [Usage Plans and Rate Limits in the Selling Partner API](https://developer-docs.amazon.com/sp-api/docs/usage-plans-and-rate-limits-in-the-sp-api).
      operationId: getReports
      parameters:
      - description: "A list of report types used to filter reports. Refer to [Report\
          \ Type Values](https://developer-docs.amazon.com/sp-api/docs/report-type-values)\
          \ for more information. When reportTypes is provided, the other filter parameters\
          \ (processingStatuses, marketplaceIds, createdSince, createdUntil) and pageSize\
          \ may also be provided. Either reportTypes or nextToken is required."
        explode: false
        in: query
        name: reportTypes
        schema:
          items:
            type: string
          maxItems: 10
          minItems: 1
          type: array
        style: form
      - description: A list of processing statuses used to filter reports.
        explode: false
        in: query
        name: processingStatuses
        schema:
          items:
            enum:
            - CANCELLED
            - DONE
            - FATAL
            - IN_PROGRESS
            - IN_QUEUE
            type: string
            x-docgen-enum-table-extension:
            - value: CANCELLED
              description: "The report was cancelled. There are two ways a report\
                \ can be cancelled: an explicit cancellation request before the report\
                \ starts processing, or an automatic cancellation if there is no data\
                \ to return."
            - value: DONE
              description: The report has completed processing.
            - value: FATAL
              description: The report was aborted due to a fatal error.
            - value: IN_PROGRESS
              description: The report is being processed.
            - value: IN_QUEUE
              description: The report has not yet started processing. It may be waiting
                for another `IN_PROGRESS` report.
          minItems: 1
          type: array
        style: form
      - description: A list of marketplace identifiers used to filter reports. The
          reports returned will match at least one of the marketplaces that you specify.
        explode: false
        in: query
        name: marketplaceIds
        schema:
          items:
            type: string
          maxItems: 10
          minItems: 1
          type: array
        style: form
      - description: The maximum number of reports to return in a single call.
        in: query
        name: pageSize
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      - description: "The earliest report creation date and time for reports to include\
          \ in the response, in <a href='https://developer-docs.amazon.com/sp-api/docs/iso-8601'>ISO\
          \ 8601</a> date time format. The default is 90 days ago. Reports are retained\
          \ for a maximum of 90 days."
        in: query
        name: createdSince
        schema:
          format: date-time
          type: string
      - description: "The latest report creation date and time for reports to include\
          \ in the response, in <a href='https://developer-docs.amazon.com/sp-api/docs/iso-8601'>ISO\
          \ 8601</a> date time format. The default is now."
        in: query
        name: createdUntil
        schema:
          format: date-time
          type: string
      - description: "A string token returned in the response to your previous request.\
          \ `nextToken` is returned when the number of results exceeds the specified\
          \ `pageSize` value. To get the next page of results, call the `getReports`\
          \ operation and include this token as the only parameter. Specifying `nextToken`\
          \ with any other parameters will cause the request to fail."
        in: query
        name: nextToken
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReportsResponse'
          description: Success.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
