    Marketplace:
      description: Information about an Amazon marketplace where a seller can list
        items and customers can view and purchase items.
      example:
        countryCode: countryCode
        domainName: domainName
        name: name
        defaultCurrencyCode: defaultCurrencyCode
        defaultLanguageCode: defaultLanguageCode
        id: id
      properties:
        id:
          description: The encrypted marketplace value.
          type: string
        name:
          description: The marketplace name.
          type: string
        countryCode:
          description: The ISO 3166-1 alpha-2 format country code of the marketplace.
          pattern: "^([A-Z]{2})$"
          type: string
        defaultCurrencyCode:
          description: The ISO 4217 format currency code of the marketplace.
          type: string
        defaultLanguageCode:
          description: The ISO 639-1 format language code of the marketplace.
          type: string
        domainName:
          description: The domain name of the marketplace.
          type: string
      required:
      - countryCode
      - defaultCurrencyCode
      - defaultLanguageCode
      - domainName
      - id
      - name
      type: object
    Participation:
      description: Information that is specific to a seller in a marketplace.
      example:
        isParticipating: true
        hasSuspendedListings: true
      properties:
        isParticipating:
          description: "If `true`, the seller participates in the marketplace. Otherwise\
            \ `false`."
          type: boolean
        hasSuspendedListings:
          description: "Specifies if the seller has suspended listings. `true` if\
            \ the seller Listing Status is set to Inactive, otherwise `false`."
          type: boolean
      required:
