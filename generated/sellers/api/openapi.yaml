      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              example:
                payload:
                  businessType: PRIVATE_LIMITED
                  marketplaceParticipationList:
                  - marketplace:
                      id: ATVPDKIKX0DER
                      name: United States
                      countryCode: US
                      domainName: www.amazon.com
                    storeName: BestSellerStore
                    participation:
                      isParticipating: true
                      hasSuspendedListings: false
                  sellingPlan: PROFESSIONAL
