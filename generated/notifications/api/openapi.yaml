openapi: 3.0.1
info:
  contact:
    name: Selling Partner API Developer Support
    url: https://sellercentral.amazon.com/gp/mws/contactus.html
  description: |-
    The Selling Partner API for Notifications lets you subscribe to notifications that are relevant to a selling partner's business. Using this API you can create a destination to receive notifications, subscribe to notifications, delete notification subscriptions, and more.

    For more information, refer to the [Notifications Use Case Guide](https://developer-docs.amazon.com/sp-api/docs/notifications-api-v1-use-case-guide).
  license:
    name: Apache License 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  title: Selling Partner API for Notifications
  version: v1
servers:
- url: https://sellingpartnerapi-na.amazon.com/
paths:
  /notifications/v1/subscriptions:
    get:
      description: |-
        Returns information about subscriptions of the specified notification type. You can use this API to retrieve all subscriptions when multiple subscriptions exist for a notification type (for example, when using filter expressions).

        The operation returns all subscriptions for the caller's party.

        `payloadVersion` is an optional parameter. When you do not provide `payloadVersion`, the operation returns subscriptions across all payload versions.

        **Usage Plan:**

        | Rate (requests per second) | Burst |
        | ---- | ---- |
        | 1 | 5 |

        The `x-amzn-RateLimit-Limit` response header contains the usage plan rate limits for the operation, when available. The preceding table contains the default rate and burst values for this operation. Selling partners whose business demands require higher throughput might have higher rate and burst values than those shown here. For more information, refer to [Usage Plans and Rate Limits in the Selling Partner API](https://developer-docs.amazon.com/sp-api/docs/usage-plans-and-rate-limits-in-the-sp-api).
      operationId: getSubscriptions
      parameters:
      - description: |-
          A list of notification types to retrieve subscriptions for. Currently limited to a single notification type per request.

           For more information about notification types, refer to the [Notifications API v1 Use Case Guide](https://developer-docs.amazon.com/sp-api/docs/notifications-api-v1-use-case-guide).
        explode: false
        in: query
        name: notificationTypes
        required: true
        schema:
          items:
            type: string
          maxItems: 1
          minItems: 1
          type: array
        style: form
      - description: The version of the payload object to be used in the notification.
        in: query
        name: payloadVersion
        schema:
          type: string
      - description: The maximum number of subscriptions to return per page. Minimum
          value is 30. Maximum value is 100. Default is 30.
        in: query
        name: pageSize
        schema:
          default: 30
          maximum: 100
          minimum: 30
          type: integer
      - description: "A token to retrieve the next page of results. If this field\
          \ is not empty in a response, pass its value in the next request to retrieve\
          \ the next page."
        in: query
        name: nextToken
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubscriptionsResponse'
          description: Success.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
          x-amzn-api-sandbox:
            static:
            - request:
                parameters:
                  notificationTypes:
                    value:
                    - ANY_OFFER_CHANGED
              response:
                payload:
                  subscriptions:
                  - subscriptionId: 7fcacc7e-727b-11e9-8848-1681be663d3e
                    payloadVersion: "1.0"
                    destinationId: 3acafc7e-121b-1329-8ae8-1571be663aa2
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubscriptionsResponse'
          description: Request has missing or invalid parameters and cannot be parsed.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
        "403":
