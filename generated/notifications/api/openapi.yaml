      parameters:
      - description: |-
          The type of notification.

           For more information about notification types, refer to the [Notifications API v1 Use Case Guide](https://developer-docs.amazon.com/sp-api/docs/notifications-api-v1-use-case-guide).
        in: path
        name: notificationType
        required: true
        schema:
          type: string
      - description: The version of the payload object to be used in the notification.
        in: query
        name: payloadVersion
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubscriptionResponse'
            Successful Response:
              example:
                payload:
                  subscriptionId: 7fcacc7e-727b-11e9-8848-1681be663d3e
                  payloadVersion: "1.0"
                  destinationId: 3acafc7e-121b-1329-8ae8-1571be663aa2
                  processingDirective:
                    eventFilter:
                      marketplaceIds:
                      - ATVPDKIKX0DER
                      - A2EUQ1WTGCTBG2
                      aggregationSettings:
                        aggregationTimePeriod: FiveMinutes
                      eventFilterType: ANY_OFFER_CHANGED
