  /finances/2024-06-19/summary:
    get:
      description: |-
        Retrieve the financial summary for the specified time period or settlement period.

        **Usage Plan:**

        | Rate (requests per second) | Burst |
        | ---- | ---- |
        | 0.5 | 10 |

        The `x-amzn-RateLimit-Limit` response header returns the usage plan rate limits that apply to the operation, when available. The preceding table indicates the default rate and burst values for this operation. Selling partners whose business demands require higher throughput may have higher rate and burst values than those shown here. For more information, refer to [Usage Plans and Rate Limits in the Selling Partner API](https://developer-docs.amazon.com/sp-api/docs/usage-plans-and-rate-limits-in-the-sp-api).
      operationId: listSummary
      parameters:
      - description: "The marketplaces from which to retrieve summaries. If omitted,\
          \ summaries from all applicable marketplaces may be returned. To find the\
          \ marketplace ID for a region, refer to [Marketplace IDs](https://developer-docs.amazon.com/sp-api/docs/marketplace-ids)."
        example:
        - AXXXXXXXXXER
        explode: false
        in: query
        name: marketplaceIds
        schema:
          items:
            type: string
          type: array
        style: form
      - description: The type of account to include in the response.
        example: Standard Orders
        in: query
        name: accountType
        schema:
          type: string
      - description: "The name of the `relatedIdentifier`. The only possible value\
          \ is `SETTLEMENT_ID`, the settlement ID associated with the summary."
        example: SETTLEMENT_ID
        in: query
        name: relatedIdentifierName
        schema:
          type: string
      - description: The value of the `relatedIdentifier`.
        example: "8129762527551"
        in: query
        name: relatedIdentifierValue
        schema:
          type: string
      - description: "The start of the period for which to retrieve summaries. When\
          \ provided, the response will only include summaries with transactions that\
          \ occurred on or after the specified date. The value must be formatted in\
          \ [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601) date\
          \ format."
        example: 2025-01-12
        in: query
        name: periodStart
        schema:
          format: date
          type: string
      - description: "The end of the period for which to retrieve summaries. When\
          \ provided, the response will only include summaries with transactions that\
          \ occurred on or before the specified date. The value must be formatted\
          \ in [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601)\
          \ date format."
        example: 2025-01-12
