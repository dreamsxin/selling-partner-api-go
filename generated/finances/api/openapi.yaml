        name: periodEnd
        schema:
          format: date
          type: string
      - description: "A token that you use to retrieve subsequent pages of results.\
          \ When there are more results available, the response will include a `nextToken`\
          \ value. To get the next page of results, call the operation with this token\
          \ and include the same arguments as the call that produced the token. Repeat\
          \ this process until the `nextToken` value is null to retrieve all results."
        example: jehgri34yo7jr9e8f984tr9i4o
        in: query
        name: nextToken
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
          description: Success.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
          x-amzn-api-sandbox:
            static:
            - request:
                parameters:
                  marketplaceIds:
                    value:
                    - AXXXXXXXXXER
                  periodStart:
                    value: 2025-01-12
                  periodEnd:
                    value: 2025-01-12
              response:
