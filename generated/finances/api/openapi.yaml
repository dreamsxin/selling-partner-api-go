                - partnerMetadata:
                    partnerId: XXXXXXXXXXXXXX
                    accountType: Standard Orders
                    marketplaceId: AXXXXXXXXXER
                  periodStart: 2025-01-12
                  periodEnd: 2025-01-12
                  netProceeds:
                    currencyAmount: 8000
