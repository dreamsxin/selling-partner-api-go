          description: Temporary overloading or maintenance of the server.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
  /finances/2024-06-19/balances:
    get:
      description: |-
        Retrieve a balance. This balance can be a past balances at a specified date, or a current balance. Sub-balances are listed by account type and marketplace.

        **Usage Plan:**

        | Rate (requests per second) | Burst |
        | ---- | ---- |
        | 0.5 | 10 |

        The `x-amzn-RateLimit-Limit` response header returns the usage plan rate limits that apply to the operation, when available. The preceding table indicates the default rate and burst values for this operation. Selling partners whose business demands require higher throughput may have higher rate and burst values than those shown here. For more information, refer to [Usage Plans and Rate Limits in the Selling Partner API](https://developer-docs.amazon.com/sp-api/docs/usage-plans-and-rate-limits-in-the-sp-api).
      operationId: listBalances
      parameters:
      - description: "The marketplaces from which to retrieve balances. If omitted,\
          \ balances from all applicable marketplaces may be returned. To find the\
          \ marketplace ID for a region, refer to [Marketplace IDs](https://developer-docs.amazon.com/sp-api/docs/marketplace-ids)."
        example:
        - AXXXXXXXXXER
        explode: false
        in: query
        name: marketplaceIds
        schema:
          items:
            type: string
          type: array
        style: form
      - description: |-
          The type of balance to include in the response. If omitted, all balance types may be included in the response.

          **Possible values:** `AVAILABLE`, `RESERVED`, `TOTAL`, `DEFERRED`, `ACCOUNT_LEVEL_RESERVE`
        example: TOTAL
        in: query
        name: balanceType
        schema:
          type: string
      - description: The type of account to include in the response.
        example: Standard Orders
        in: query
        name: accountType
        schema:
          type: string
      - description: "The date from which you want to retrieve balances. If provided,\
          \ the response includes historical balances at the specified date. The value\
          \ must be in [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601)\
          \ date format. If omitted, the point in time balance is provided."
        example: 2025-01-12
        in: query
        name: asOfDate
        schema:
          format: date
          type: string
      - description: "A token that you use to retrieve subsequent pages of results.\
          \ When there are more than 500 results available, the response will include\
          \ a `nextToken` value. To get the next page of results, call the operation\
          \ with this token and include the same arguments as the call that produced\
          \ the token. Repeat this process until the `nextToken` value is null to\
          \ retrieve all results."
        example: jehgri34yo7jr9e8f984tr9i4o
        in: query
        name: nextToken
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBalancesResponse'
          description: Success.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
          x-amzn-api-sandbox:
            static:
            - request:
                parameters:
                  marketplaceIds:
                    value:
                    - AXXXXXXXXXER
                  balanceType:
                    value: TOTAL
              response:
                balances:
                - partnerMetadata:
                    partnerId: XXXXXXXXXXXXXX
                    accountType: Standard Orders
                    marketplaceId: AXXXXXXXXXER
                  balanceType: TOTAL
                  amount:
                    currencyAmount: 15000
                    currencyCode: USD
                  lastUpdatedTime: 2025-01-12T10:30:00+09:00
                  balances:
