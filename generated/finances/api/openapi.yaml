openapi: 3.0.1
info:
  contact:
    name: Selling Partner API Developer Support
    url: https://sellercentral.amazon.com/gp/mws/contactus.html
  description: The Selling Partner API for Finances provides financial information
    relevant to a seller's business. You can obtain financial events for a given order
    or date range without having to wait until a statement period closes.
  license:
    name: Apache License 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  title: The Selling Partner API for Finances
  version: 2024-06-19
servers:
- url: https://sellingpartnerapi-na.amazon.com/
paths:
  /finances/2024-06-19/transactions:
    get:
      description: |-
        Returns transactions for the given parameters. Financial events might not include orders from the last 48 hours. **Note:** If you want to retrieve MFN orders in the US store, do not supply the `marketplaceId` parameter.

        **Usage plan:**

        | Rate (requests per second) | Burst |
        | ---- | ---- |
        | 0.5 | 10 |

        The `x-amzn-RateLimit-Limit` response header returns the usage plan rate limits that were applied to the requested operation, when available. The preceding table contains the default rate and burst values for this operation. Selling partners whose business demands require higher throughput may have higher rate and burst values than those shown here. For more information, refer to [Usage Plans and Rate Limits](https://developer-docs.amazon.com/sp-api/docs/usage-plans-and-rate-limits).
      operationId: listTransactions
      parameters:
      - description: |-
          The response includes financial events posted on or after this date. This date must be in [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601) date-time format. The date-time must be more than two minutes before the time of the request.

          This field is required if you do not specify a related identifier.
        example: 2023-01-12
        in: query
        name: postedAfter
        schema:
          format: date-time
          type: string
      - description: |-
          The response includes financial events posted before (but not on) this date. This date must be in [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601) date-time format.

          The date-time must be later than `PostedAfter` and more than two minutes before the request was submitted. If `PostedAfter` and `PostedBefore` are more than 180 days apart, the response is empty.

          **Default:** Two minutes before the time of the request.
        example: 2023-02-12
        in: query
        name: postedBefore
        schema:
          format: date-time
          type: string
      - description: "The identifier of the marketplace from which you want to retrieve\
          \ transactions. The marketplace ID is the globally unique identifier of\
          \ a marketplace. To find the ID for a marketplace, refer to [Marketplace\
          \ IDs](https://developer-docs.amazon.com/sp-api/docs/marketplace-ids)."
        example: ATIV93840DER
        in: query
        name: marketplaceId
        schema:
          type: string
      - description: |-
          The status of the transaction.

          **Possible values:**

          * `DEFERRED`: the transaction is currently deferred.
          * `RELEASED`: the transaction is currently released.
          * `DEFERRED_RELEASED`: the transaction was deferred in the past, but is now released. The status of a deferred transaction is updated to `DEFERRED_RELEASED` when the transaction is released.
        example: RELEASED
        in: query
        name: transactionStatus
        schema:
          type: string
      - description: "The name of the `relatedIdentifier`.\n\n**Possible values:**\n\
          \n* `FINANCIAL_EVENT_GROUP_ID`: the financial event group ID associated\
          \ with the transaction.\n\n* `ORDER_ID`: the order ID associated with the\
          \ transaction.  \n\n**Note:**\n\n`FINANCIAL_EVENT_GROUP_ID` and `ORDER_ID`\
          \ are the only `relatedIdentifier` with filtering capabilities at the moment.\
          \ While other `relatedIdentifier` values will be included in the response\
          \ when available, they cannot be used for filtering purposes."
        example: FINANCIAL_EVENT_GROUP_ID
        in: query
        name: relatedIdentifierName
        schema:
          type: string
      - description: The value of the `relatedIdentifier`.
        example: "8129762527551"
        in: query
        name: relatedIdentifierValue
        schema:
          type: string
      - description: "The response includes `nextToken` when the number of results\
          \ exceeds the specified `pageSize` value. To get the next page of results,\
          \ call the operation with this token and include the same arguments as the\
          \ call that produced the token. To get a complete list, call this operation\
          \ until `nextToken` is null. Note that this operation can return empty pages."
        example: jehgri34yo7jr9e8f984tr9i4o
        in: query
        name: nextToken
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsResponse'
          description: Success.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
          x-amzn-api-sandbox:
            static:
            - request:
                parameters:
                  postedAfter:
                    value: 2023-03-07
                  nextToken:
                    value: jehgri34yo7jr9e8f984tr9i4o
              response:
                payload:
                  nextToken: Next token value
                  transactions:
                  - sellingPartnerMetadata:
                      sellingPartnerId: A3TH9S8BH6GOGM
                      accountType: PAYABLE
                      marketplaceId: ATIV93840DER
                    relatedIdentifiers:
                    - relatedIdentifierName: FINANCIAL_EVENT_GROUP_ID
                      relatedIdentifierValue: 4MVaHcsAfaYAlwlaPWrXJxrfUiKfYZ2ooWtY7528FUA
                    - relatedIdentifierName: ORDER_ID
                      relatedIdentifierValue: "8129762527551"
                    transactionType: Shipment
                    postedDate: 2020-07-14T03:35:13.214Z
                    totalAmount:
                      currencyAmount: 10
                      currencyCode: USD
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: Request has missing or invalid parameters and cannot be parsed.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
          x-amzn-api-sandbox:
            static:
            - request:
                parameters:
                  postedBefore:
                    value: 2022-03-07
              response:
                errors:
                - code: InvalidInput
                  message: Start date cannot be null
                  details: Start date cannot be null
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: "Indicates that access to the resource is forbidden. Possible\
            \ reasons include Access Denied, Unauthorized, Expired Token, or Invalid\
            \ Signature."
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: The resource specified does not exist.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: The request size exceeded the maximum accepted size.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: The request payload is in an unsupported format.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: The frequency of requests was greater than allowed.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
          description: An unexpected condition occurred that prevented the server
            from fulfilling the request.
          headers:
            x-amzn-RequestId:
              description: Unique request reference identifier.
              schema:
                type: string
        "503":
          content:
