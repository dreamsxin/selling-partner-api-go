openapi: 3.0.1
info:
  contact:
    name: Selling Partner API Developer Support
    url: https://sellercentral.amazon.com/gp/mws/contactus.html
  description: |-
    Use the Selling Partner API for Catalog Items to retrieve information about items in the Amazon catalog.

    For more information, refer to the [Catalog Items API Use Case Guide](https://developer-docs.amazon.com/sp-api/docs/:catalog-items-api-v2022-04-01-use-case-guide).
  license:
    name: Apache License 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  title: Selling Partner API for Catalog Items
  version: 2022-04-01
servers:
- url: https://sellingpartnerapi-na.amazon.com/
paths:
  /catalog/2022-04-01/items:
    get:
      description: |-
        Search for a list of Amazon catalog items and item-related information. You can search by identifier or by keywords.

        **Usage Plan:**

        | Rate (requests per second) | Burst |
        | ---- | ---- |
        | 2 | 2 |

        The `x-amzn-RateLimit-Limit` response header contains the usage plan rate limits for the operation, when available. The preceding table contains the default rate and burst values for this operation. Selling partners whose business demands require higher throughput might have higher rate and burst values than those shown here. For more information, refer to [Usage Plans and Rate Limits](https://developer-docs.amazon.com/sp-api/docs/usage-plans-and-rate-limits-in-the-sp-api).
      operationId: searchCatalogItems
      parameters:
      - description: A comma-delimited list of product identifiers that you can use
          to search the Amazon catalog. **Note:** You cannot include `identifiers`
          and `keywords` in the same request.
        example: shoes
        explode: false
        in: query
        name: identifiers
        schema:
          items:
            type: string
          maxItems: 20
          type: array
        style: form
      - description: The type of product identifiers that you can use to search the
          Amazon catalog. **Note:** `identifiersType` is required when `identifiers`
          is in the request.
        example: ASIN
        in: query
        name: identifiersType
        schema:
          enum:
          - ASIN
          - EAN
          - GTIN
          - ISBN
          - JAN
          - MINSAN
          - SKU
          - UPC
          type: string
          x-docgen-enum-table-extension:
          - value: ASIN
            description: Amazon Standard Identification Number
          - value: EAN
            description: European Article Number
          - value: GTIN
            description: Global Trade Item Number
          - value: ISBN
            description: International Standard Book Number
          - value: JAN
            description: Japanese Article Number
          - value: MINSAN
            description: Minsan Code
          - value: SKU
            description: "Stock Keeping Unit, a seller-specified identifier for an\
              \ Amazon listing. **Note:** Must be accompanied by `sellerId`."
          - value: UPC
            description: Universal Product Code
        x-docgen-enum-table-extension:
        - value: ASIN
          description: Amazon Standard Identification Number
        - value: EAN
          description: European Article Number
        - value: GTIN
          description: Global Trade Item Number
        - value: ISBN
          description: International Standard Book Number
        - value: JAN
          description: Japanese Article Number
        - value: MINSAN
          description: Minsan Code
        - value: SKU
          description: "Stock Keeping Unit, a seller-specified identifier for an Amazon\
            \ listing. **Note:** Must be accompanied by `sellerId`."
        - value: UPC
          description: Universal Product Code
      - description: "A comma-delimited list of Amazon marketplace identifiers. To\
          \ find the ID for your marketplace, refer to [Marketplace IDs](https://developer-docs.amazon.com/sp-api/docs/marketplace-ids)."
        example: ATVPDKIKX0DER
        explode: false
        in: query
        name: marketplaceIds
        required: true
        schema:
          items:
            type: string
          maxItems: 1
          type: array
        style: form
      - description: A comma-delimited list of datasets to include in the response.
        example: summaries
        explode: false
        in: query
        name: includedData
        schema:
          default: "[\"summaries\"]"
          items:
            enum:
            - attributes
            - classifications
            - dimensions
            - identifiers
            - images
            - productTypes
            - relationships
            - salesRanks
            - summaries
            - vendorDetails
            type: string
            x-docgen-enum-table-extension:
            - value: attributes
              description: "A JSON object containing structured item attribute data\
                \ that is keyed by attribute name. Catalog item attributes conform\
                \ to the related Amazon product type definitions that you can get\
                \ from the [Product Type Definitions API](https://developer-docs.amazon.com/sp-api/reference/product-type-definitions-v2020-09-01)."
            - value: classifications
              description: Classifications (browse nodes) for an item in the Amazon
                catalog.
            - value: dimensions
              description: Dimensions of an item in the Amazon catalog.
            - value: identifiers
              description: "Identifiers that are associated with the item in the Amazon\
                \ catalog, such as UPC and EAN."
            - value: images
              description: Images for an item in the Amazon catalog.
            - value: productTypes
              description: Product types associated with the Amazon catalog item.
            - value: relationships
              description: "Relationship details of an Amazon catalog item (for example,\
                \ variations)."
            - value: salesRanks
              description: Sales ranks of an Amazon catalog item.
            - value: summaries
              description: "Summary of an Amazon catalog item. For more information,\
                \ refer to the `attributes` of an Amazon catalog item."
            - value: vendorDetails
              description: Vendor details associated with an Amazon catalog item.
                Vendor details are only available to vendors.
          type: array
        style: form
      - description: The locale for which you want to retrieve localized summaries.
          Defaults to the primary locale of the marketplace.
        example: en_US
        in: query
        name: locale
        schema:
          type: string
      - description: "A selling partner identifier, such as a seller account or vendor\
          \ code. **Note:** Required when `identifiersType` is `SKU`."
        in: query
        name: sellerId
        schema:
          type: string
      - description: A comma-delimited list of keywords that you can use to search
          the Amazon catalog. **Note:** You cannot include `keywords` and `identifiers`
          in the same request.
        example: shoes
        explode: false
        in: query
        name: keywords
        schema:
          items:
            type: string
          maxItems: 20
          type: array
        style: form
      - description: A comma-delimited list of brand names that you can use to limit
          the search in queries based on `keywords`. **Note:** Cannot be used with
          `identifiers`.
        example: Beautiful Boats
        explode: false
        in: query
        name: brandNames
        schema:
          items:
            type: string
          type: array
        style: form
      - description: A comma-delimited list of classification identifiers that you
          can use to limit the search in queries based on `keywords`. **Note:** Cannot
          be used with `identifiers`.
        example: "12345678"
        explode: false
        in: query
        name: classificationIds
        schema:
          items:
            type: string
          type: array
        style: form
      - description: The number of results to include on each page.
        example: 9
        in: query
        name: pageSize
        schema:
          default: 10
          maximum: 20
          type: integer
      - description: A token that you can use to fetch a specific page when there
          are multiple pages of results.
        example: sdlkj234lkj234lksjdflkjwdflkjsfdlkj234234234234
        in: query
        name: pageToken
        schema:
          type: string
      - description: The language of the keywords that are included in queries based
          on `keywords`. Defaults to the primary locale of the marketplace. **Note:**
          Cannot be used with `identifiers`.
        example: en_US
        in: query
        name: keywordsLocale
        schema:
          type: string
