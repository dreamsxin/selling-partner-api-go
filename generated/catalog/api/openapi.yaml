      description: "Pagination occurs when a request produces a response that exceeds\
        \ the `pageSize`. This means that the response is divided into individual\
        \ pages. To retrieve the next page or the previous page of results, you must\
        \ pass the `nextToken` value or the `previousToken` value as the `pageToken`\
        \ parameter in the next request. There is no `nextToken` in the pagination\
        \ object on the last page."
